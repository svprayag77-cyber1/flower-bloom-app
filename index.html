<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🪔 மதுரை மல்லி மாலை - Madurai Mulla Mala Game</title>
  
  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#1a0f0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MullaMala">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">

  <!-- OpenGraph / Social Sharing Preview -->
  <meta property="og:title" content="🪔 மதுரை மல்லி மாலை - Madurai Mulla Mala Game">
  <meta property="og:description" content="Experience the timeless South Indian temple tradition of weaving fragrant jasmine, roses, and kanakambaram into a Mulla Mala garland.">
  <meta property="og:type" content="website">

  <style>
    :root {
      --bg-temple: radial-gradient(circle at 50% 30%, #2b1b17 0%, #160c0a 60%, #090504 100%);
      --gold-accent: #ffd700;
      --gold-gradient: linear-gradient(135deg, #ffe57f 0%, #ffb300 50%, #d48800 100%);
      --glass-panel: rgba(18, 11, 9, 0.58);
      --glass-border: rgba(255, 215, 0, 0.32);
      --text-gold: #ffe082;
      --text: #fff9f0;
      --text-muted: #d7ccc8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-temple);
      color: var(--text);
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    /* ===================================================================== */
    /* 1. TRADITIONAL ORNATE TEMPLE BANNER (HEADER)                          */
    /* ===================================================================== */
    .temple-banner-wrapper {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      width: 92%;
      max-width: 1100px;
      pointer-events: auto;
    }

    .temple-banner {
      background: linear-gradient(180deg, rgba(38, 22, 18, 0.94) 0%, rgba(20, 11, 9, 0.92) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 215, 0, 0.45);
      border-bottom: 2px solid #ffd700;
      border-radius: 18px;
      padding: 10px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7), 0 0 25px rgba(255, 215, 0, 0.12), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      position: relative;
    }

    /* Decorative Ornate Corner Accents */
    .temple-banner::before, .temple-banner::after {
      content: '❖';
      position: absolute;
      font-size: 11px;
      color: #ffd700;
      opacity: 0.85;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
    }
    .temple-banner::before { top: 6px; left: 8px; }
    .temple-banner::after { top: 6px; right: 8px; }

    .temple-title-block {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .temple-tamil-heading {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 14px rgba(255, 215, 0, 0.35);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .temple-sub-heading {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .temple-badge {
      display: inline-block;
      padding: 1px 6px;
      font-size: 10px;
      border-radius: 12px;
      background: rgba(255, 215, 0, 0.18);
      color: #ffd54f;
      border: 1px solid rgba(255, 215, 0, 0.4);
      font-weight: 600;
    }

    /* Mode Switcher inside Temple Banner */
    .temple-mode-toggle {
      display: flex;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 215, 0, 0.28);
      border-radius: 24px;
      padding: 3px;
      gap: 3px;
    }

    .temple-mode-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .temple-mode-btn.active {
      background: var(--gold-gradient);
      color: #2b1704;
      box-shadow: 0 2px 12px rgba(255, 179, 0, 0.4);
      font-weight: 700;
    }

    .temple-mode-btn:not(.active):hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    /* Garland Stats Badge */
    .temple-stats-pill {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .temple-stats-pill strong {
      color: #ffd54f;
      font-weight: 700;
      font-size: 14px;
    }

    /* ===================================================================== */
    /* 2. MODERN FROSTED GLASS DOCK (BUTTONS)                                */
    /* ===================================================================== */
    .glass-dock {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      background: var(--glass-panel);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 9px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 25px rgba(255, 215, 0, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.12);
      max-width: 95vw;
      overflow-x: auto;
    }

    .glass-btn {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 215, 0, 0.28);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      padding: 8px 15px;
      border-radius: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .glass-btn:hover {
      background: rgba(255, 215, 0, 0.18);
      border-color: rgba(255, 215, 0, 0.75);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(255, 215, 0, 0.25);
      color: #fff;
    }

    .glass-btn:active {
      transform: translateY(1px);
    }

    .glass-btn.active {
      background: linear-gradient(135deg, rgba(255, 179, 0, 0.35), rgba(216, 67, 21, 0.35));
      border-color: #ffd54f;
      color: #fff;
      box-shadow: 0 0 14px rgba(255, 213, 79, 0.35);
    }

    /* Special Gold Finish Button */
    .glass-btn-gold {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.28), rgba(255, 152, 0, 0.32));
      border: 1px solid #ffd700;
      color: #fff9e6;
      font-weight: 600;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.25);
    }

    .glass-btn-gold:hover {
      background: var(--gold-gradient);
      color: #2b1704;
      border-color: #ffe082;
      box-shadow: 0 6px 24px rgba(255, 179, 0, 0.55);
      font-weight: 700;
    }

    .glass-divider {
      width: 1px;
      height: 22px;
      background: rgba(255, 215, 0, 0.2);
    }

    .glass-select {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 215, 0, 0.28);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      padding: 7px 12px;
      border-radius: 14px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .glass-select:hover {
      border-color: rgba(255, 215, 0, 0.6);
    }

    .glass-select option {
      background: #1a0f0d;
      color: #fff;
    }

    /* Floating instructional hint */
    .instruction-tooltip {
      position: absolute;
      top: 86px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      background: rgba(28, 16, 12, 0.85);
      border: 1px solid rgba(255, 215, 0, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      color: #ffe082;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    @media (max-width: 860px) {
      .temple-banner {
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
      }
      .instruction-tooltip {
        top: 135px;
      }
    }
  </style>
</head>
<body>
  <!-- ===================================================================== -->
  <!-- 1. ORNATE TRADITIONAL TEMPLE BANNER                                   -->
  <!-- ===================================================================== -->
  <div class="temple-banner-wrapper">
    <div class="temple-banner">
      <!-- Title Block -->
      <div class="temple-title-block">
        <div class="temple-tamil-heading">
          <span>🪔</span> மதுரை மல்லி மாலை
        </div>
        <div class="temple-sub-heading">
          <span class="temple-badge">TRADITION</span> Madurai Mulla Mala • Temple Flower Weaving
        </div>
      </div>

      <!-- Mode Switcher -->
      <div class="temple-mode-toggle">
        <button id="modeMalaBtn" class="temple-mode-btn active">
          🪔 மல்லி மாலை (Mulla Mala)
        </button>
        <button id="modeBloomBtn" class="temple-mode-btn">
          🌸 பூந்தோட்டம் (Bloom Canvas)
        </button>
      </div>

      <!-- Live Counter Pill -->
      <div class="temple-stats-pill">
        <span>தொடுத்த மலர்கள் (Flowers):</span>
        <strong id="garland-count">0</strong>
      </div>
    </div>
  </div>

  <!-- Floating Instructional Hint -->
  <div class="instruction-tooltip" id="tip-pill">
    <span>✨</span> வாழையிலையிலுள்ள மலர்களை எடுத்து மேலே தொங்கும் வெள்ளை நூலில் தொடுக்கவும்! (Pick flowers from banana leaf & knot onto the white rope)
  </div>

  <!-- Main Canvas -->
  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- ===================================================================== -->
  <!-- 2. MODERN FROSTED GLASS DOCK (BUTTONS)                                -->
  <!-- ===================================================================== -->
  <div class="glass-dock">
    <select id="refillSelect" class="glass-select" title="Choose specific flower to refill">
      <option value="all">🍃 Refill: All Flowers</option>
      <option value="jasmine">🤍 Madurai Malligai (Jasmine)</option>
      <option value="rose">🌹 Paneer Roja (Rose)</option>
      <option value="kanakambaram">🏵️ Kanakambaram (Saffron)</option>
      <option value="sevvanthi">🌻 Sevvanthi (Marigold)</option>
      <option value="vadamalli">💜 Vadamalli (Purple)</option>
      <option value="tulsi">🌿 Sacred Tulsi</option>
    </select>

    <button id="refillBtn" class="glass-btn" title="Add a fresh handful of flowers to the tray">
      🌸 Add Flowers
    </button>

    <div class="glass-divider"></div>

    <button id="hairModeBtn" class="glass-btn" title="Preview garland draped on South Indian hair bun (Kondai)">
      👑 Try on Hair
    </button>

    <button id="soundToggleBtn" class="glass-btn active" title="Toggle Carnatic chime harmonics">
      🔔 Temple Bells: ON
    </button>

    <button id="celebrateBtn" class="glass-btn glass-btn-gold" title="Complete the garland with celebratory temple bells & flower shower">
      ✨ Finish Garland!
    </button>

    <div class="glass-divider"></div>

    <button id="clearBtn" class="glass-btn" title="Start a fresh thread">
      🧹 New Thread
    </button>

    <button id="saveBtn" class="glass-btn" title="Save your garland artwork">
      📸 Save
    </button>
  </div>

  <!-- ===================================================================== -->
  <!-- MODULAR SYSTEMS ARCHITECTURE (LIBRARIES)                              -->
  <!-- ===================================================================== -->
  <!-- 1. Running Bloom Engine (for Free Bloom mode) -->
  <script src="bloom-presets.js"></script>
  <script src="flower-bloom.js"></script>

  <!-- 2. Mulla Mala Game Engine (South Indian flower stringing game) -->
  <script src="mala-engine.js"></script>

  <!-- 3. Orchestration & Event Wiring -->
  <script>
    const canvas = document.getElementById('gameCanvas');
    const garlandCountEl = document.getElementById('garland-count');
    const tipPill = document.getElementById('tip-pill');
    const hairModeBtn = document.getElementById('hairModeBtn');
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const refillBtn = document.getElementById('refillBtn');
    const refillSelect = document.getElementById('refillSelect');
    const celebrateBtn = document.getElementById('celebrateBtn');
    const clearBtn = document.getElementById('clearBtn');
    const saveBtn = document.getElementById('saveBtn');

    let currentMode = 'mala'; // 'mala' or 'bloom'
    let malaGame = null;
    let bloomEngine = null;

    // --- INITIALIZE MULLA MALA GAME ---
    function initMalaGame() {
      if (bloomEngine) {
        bloomEngine.destroy();
        bloomEngine = null;
      }
      malaGame = new MalaGameEngine.MalaGameEngine('#gameCanvas');

      malaGame.onFlowerStrung = (count) => {
        garlandCountEl.innerText = count;
        tipPill.style.opacity = '0';
      };
    }

    // --- INITIALIZE BLOOM CANVAS MODE ---
    function initBloomMode() {
      if (malaGame) {
        cancelAnimationFrame(malaGame._animFrame);
        malaGame = null;
      }
      bloomEngine = new BloomEngine('#gameCanvas', {
        palette: 'wildflower',
        species: 'random',
        enableVines: true,
        enableSound: true
      });
      bloomEngine.onBloom = (stats) => {
        garlandCountEl.innerText = stats.count;
      };
    }

    initMalaGame();

    // Mode Switchers
    const modeMalaBtn = document.getElementById('modeMalaBtn');
    const modeBloomBtn = document.getElementById('modeBloomBtn');

    modeMalaBtn.addEventListener('click', () => {
      if (currentMode === 'mala') return;
      currentMode = 'mala';
      modeMalaBtn.classList.add('active');
      modeBloomBtn.classList.remove('active');
      tipPill.innerHTML = '<span>✨</span> வாழையிலையிலுள்ள மலர்களை எடுத்து மேலே தொங்கும் வெள்ளை நூலில் தொடுக்கவும்! (Pick flowers from banana leaf & knot onto the white rope)';
      tipPill.style.opacity = '1';
      document.querySelector('.glass-dock').style.display = 'flex';
      initMalaGame();
    });

    modeBloomBtn.addEventListener('click', () => {
      if (currentMode === 'bloom') return;
      currentMode = 'bloom';
      modeBloomBtn.classList.add('active');
      modeMalaBtn.classList.remove('active');
      tipPill.innerHTML = '<span>✨</span> Run your mouse across screen to watch flowers blossom!';
      tipPill.style.opacity = '1';
      initBloomMode();
    });

    // Control Handlers for Mulla Mala
    refillBtn.addEventListener('click', () => {
      if (malaGame) {
        const val = refillSelect.value;
        malaGame.refillBasket(val === 'all' ? null : val);
      }
    });

    hairModeBtn.addEventListener('click', () => {
      if (malaGame) {
        const active = malaGame.toggleHairMode();
        hairModeBtn.classList.toggle('active', active);
        hairModeBtn.innerText = active ? '👑 Remove Hair' : '👑 Try on Hair';
      }
    });

    soundToggleBtn.addEventListener('click', () => {
      if (malaGame) {
        malaGame.sound.enabled = !malaGame.sound.enabled;
        soundToggleBtn.classList.toggle('active', malaGame.sound.enabled);
        soundToggleBtn.innerText = malaGame.sound.enabled ? '🔔 Temple Bells: ON' : '🔔 Temple Bells: OFF';
      }
    });

    celebrateBtn.addEventListener('click', () => {
      if (malaGame) {
        malaGame.celebrateComplete();
      }
    });

    clearBtn.addEventListener('click', () => {
      if (malaGame) {
        malaGame.clearGarland();
        garlandCountEl.innerText = '0';
      } else if (bloomEngine) {
        bloomEngine.clear();
        garlandCountEl.innerText = '0';
      }
    });

    saveBtn.addEventListener('click', () => {
      if (malaGame) {
        malaGame.exportPNG(`madurai-mulla-mala-${Date.now()}.png`);
      } else if (bloomEngine) {
        bloomEngine.exportPNG(`bloom-canvas-${Date.now()}.png`);
      }
    });
  </script>
</body>
</html>
